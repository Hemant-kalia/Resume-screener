<!DOCTYPE html>
<html>

<head>
  <!--  Required meta tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--  Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <!--  Custom CSS -->
  <link rel="stylesheet" href="#">

  <title>Resume Screener</title>
</head>

<body>
  
  <div class="container  my-5">
    <h2 class="my-3">Resume Screener</h2>

    <form id="uploadForm" action="/Results" method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="formFileMultiple" class="form-label">Upload Resumes</label>
        <input class="form-control" name="file" type="file" id="formFileMultiple" multiple required>
      </div>
      <div class="mb-3">
        <label for="jobDescription" class="form-label">Job Description</label>
        <textarea name="job_description" id="job_description" class="form-control" placeholder="Paste Job Description" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Analyze</button>
    </form>

  </div>

</body>

</html>
